  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio_theme');
        var isDark = saved !== 'light'; // default dark
        var root = document.documentElement;
        var darkVars = {
          '--color-bg': '#060b14',
          '--color-bg-elevated': '#0c1527',
          '--color-bg-elevated2': '#111d35',
          '--color-input-bg': '#091120',
          '--color-nav-bg': 'rgba(6, 11, 20, 0.92)',
          '--color-border': '#1b2a47',
          '--color-border-light': '#283e67',
          '--color-ink': '#f8fafc',
          '--color-ink-secondary': '#e2e8f0',
          '--color-dim': '#94a3b8',
          '--color-faint': '#64748b',
          '--color-accent': '#38bdf8',
          '--color-accent-hover': '#0ea5e9',
          '--color-accent-light': 'rgba(56, 189, 248, 0.12)',
          '--color-accent-ink': '#060b14'
        };
        var lightVars = {
          '--color-bg': '#f8fafc',
          '--color-bg-elevated': '#ffffff',
          '--color-bg-elevated2': '#f1f5f9',
          '--color-input-bg': '#ffffff',
          '--color-nav-bg': 'rgba(248, 250, 252, 0.94)',
          '--color-border': '#e2e8f0',
          '--color-border-light': '#cbd5e1',
          '--color-ink': '#0f172a',
          '--color-ink-secondary': '#1e293b',
          '--color-dim': '#475569',
          '--color-faint': '#64748b',
          '--color-accent': '#0284c7',
          '--color-accent-hover': '#0369a1',
          '--color-accent-light': 'rgba(2, 132, 199, 0.1)',
          '--color-accent-ink': '#ffffff'
        };
        var vars = isDark ? darkVars : lightVars;
        for (var key in vars) {
          root.style.setProperty(key, vars[key]);
        }
        if (isDark) {
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
        } else {
          root.classList.add('light');
          root.setAttribute('data-theme', 'light');
        }
      } catch (e) { }
    })();
  </script>
